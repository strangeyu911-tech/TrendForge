# Render Blueprint — FluxPress 最低成本部署（免费层，2分钟拿公网地址）
# 使用：Render 控制台 New > Blueprint，选本仓库，自动读取此文件
services:
  - type: web
    name: fluxpress-api
    runtime: docker
    rootDir: src/trendforge
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # LLM 配置（GLM 智谱官方直连）
      - key: TF_LLM_VENDOR
        value: glm
      - key: TF_LLM_MODEL
        value: glm-5.2
      # 真实 key 在 Render 控制台填入（sync: false 不回写仓库，安全）
      - key: TF_GLM_API_KEY
        sync: false
    # 免费层说明：
    # - 512MB 内存 / 15分钟无请求会休眠(冷启动~30s) / 无持久磁盘
    # - 数据(243篇新闻+chroma向量)已打包进镜像，/search /stats 立即可用
    # - /generate 调真实 GLM，需填 TF_GLM_API_KEY
    # - 升级付费层可挂载 disk 实现数据持久增长：
    #   disk:
    #     name: fluxpress-data
    #     mountPath: /app/data
    #     sizeGB: 1
