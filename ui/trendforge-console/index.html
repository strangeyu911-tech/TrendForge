<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrendForge · 热点内容生产控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="34" height="34" rx="9" fill="var(--ember-soft)"/>
        <path d="M11 27l4-13h2l-3 13M21 14h7M21 19h5M21 24h7" stroke="var(--ember)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="29" cy="14" r="1.6" fill="var(--ember)" />
      </svg>
      <div>
        <div class="brand__name">Trend<b>Forge</b></div>
        <div class="brand__sub">Content Ops</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <div class="nav__label">运营</div>
      <a class="nav__item is-active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        概览看板</a>
      <a class="nav__item" data-view="production">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" stroke-linejoin="round"/></svg>
        内容生产</a>
      <a class="nav__item" data-view="trace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M6 8.5v3a3 3 0 003 3h6M18 8.5v3a3 3 0 01-3 3" stroke-linecap="round"/></svg>
        任务链路</a>

      <div class="nav__label">资产</div>
      <a class="nav__item" data-view="contents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10" stroke-linecap="round"/><circle cx="19" cy="19" r="2.4"/></svg>
        内容库</a>
      <a class="nav__item" data-view="rag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" stroke-linecap="round"/></svg>
        知识库 RAG</a>
      <a class="nav__item" data-view="prompts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13 5l-2 14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Prompt 实验室</a>

      <div class="nav__label">分析</div>
      <a class="nav__item" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3M20 16v-7" stroke-linecap="round"/></svg>
        数据分析</a>
      <a class="nav__item" data-view="badcases">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 4.5-3 8-8 9-5-1-8-4.5-8-9V7l8-4z" stroke-linejoin="round"/><path d="M12 9v4M12 16.5v.5" stroke-linecap="round"/></svg>
        Bad Case 质控 <span class="nav__badge" id="bcBadge">3</span></a>
    </nav>

    <div class="sidebar__foot">
      <span class="env-pill"><span class="dot"></span> 生产环境 · v2.4.1</span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===================== MAIN ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar__title">
        <h1 id="pageTitle">概览看板</h1>
        <span id="pageSub">实时生产健康度与关键指标</span>
      </div>
      <label class="topbar__search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
        <input placeholder="搜索任务 / 内容 / Prompt…" aria-label="全局搜索" />
        <kbd>⌘K</kbd>
      </label>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换浅色 / 深色">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke-linecap="round"/></svg>
      </button>
      <button class="src-pill" id="srcPill" title="点击切换 实时 / 离线 数据源">● DEMO</button>
    </header>

    <main id="views">

      <!-- ===== OVERVIEW ===== -->
      <section class="view" id="view-overview" data-title="概览看板" data-sub="实时生产健康度与关键指标"></section>

      <!-- ===== PRODUCTION ===== -->
      <section class="view" id="view-production" data-title="内容生产" data-sub="发起话题生产 · 流水线编排 · 任务列表" hidden></section>

      <!-- ===== TRACE ===== -->
      <section class="view" id="view-trace" data-title="任务链路" data-sub="端到端可观测 · Agent Span · 决策日志" hidden></section>

      <!-- ===== RAG ===== -->
      <section class="view" id="view-rag" data-title="知识库 RAG" data-sub="新闻入库 · 向量检索 · 知识库统计" hidden></section>

      <!-- ===== PROMPTS ===== -->
      <section class="view" id="view-prompts" data-title="Prompt 实验室" data-sub="版本生命周期 · A/B 实验 · 显著性检验" hidden></section>

      <!-- ===== ANALYTICS ===== -->
      <section class="view" id="view-analytics" data-title="数据分析" data-sub="漏斗 · 分品类 CTR · 成本与效率" hidden></section>

      <!-- ===== BAD CASES ===== -->
      <section class="view" id="view-badcases" data-title="Bad Case 质控" data-sub="质量问题分诊 · 根因 · 修复追踪" hidden></section>

      <!-- ===== CONTENTS (library) ===== -->
      <section class="view" id="view-contents" data-title="内容库" data-sub="已发布内容 · 点击进入阅读页与全流程链路" hidden></section>

      <!-- ===== CONTENT (reading page) ===== -->
      <section class="view" id="view-content" data-title="内容详情" data-sub="阅读页 · 全流程可解释性" hidden></section>

    </main>
  </div>
</div>

<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
