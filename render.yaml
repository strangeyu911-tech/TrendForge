# Render Blueprint — FluxPress 最低成本部署（免费层，2分钟拿公网地址）
# 使用：Render 控制台 New > Blueprint，选本仓库，Render 会在【仓库根目录】自动读取此文件
# 注意：Blueprint 只认仓库根目录(repo root)的 render.yaml，本文件必须放在仓库根，
#       不要放在 src/trendforge/ 等子目录里，否则 Blueprint 检测不到。
services:
  - type: web
    name: fluxpress-api
    runtime: docker
    # rootDir 是 Docker 构建上下文目录，也是 dockerfilePath 的基准目录。
    # Dockerfile / requirements.txt / api/ / db.py / data/ 全部在 src/trendforge/ 下，
    # 所以构建上下文必须是 src/trendforge；dockerfilePath 相对 rootDir，./Dockerfile => src/trendforge/Dockerfile。
    rootDir: src
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # LLM 配置（GLM 智谱官方直连）
      - key: TF_LLM_VENDOR
        value: glm
      - key: TF_LLM_MODEL
        value: glm-5.2
      # 真实 key 在 Render 控制台填入（sync: false 不回写仓库，安全）
      - key: TF_GLM_API_KEY
        sync: false
    # 免费层说明：
    # - 512MB 内存 / 15分钟无请求会休眠(冷启动~30s) / 无持久磁盘
    # - 数据(243篇新闻+chroma向量)已打包进镜像，/search /stats 立即可用
    # - /generate 调真实 GLM，需填 TF_GLM_API_KEY
    # - 升级付费层可挂载 disk 实现数据持久增长：
    #   disk:
    #     name: fluxpress-data
    #     mountPath: /app/data
    #     sizeGB: 1
